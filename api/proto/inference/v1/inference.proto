syntax = "proto3";

package tinyserve.inference.v1;

option go_package = "github.com/muralidhardon/tinyserve-gateway/gen/inference/v1;inferencev1";

// Inference is the gateway's public API. Fields mirror TinyServe's /generate.
service Inference {
  // Generate streams the completion as it is produced. Every chunk but the
  // last carries text; the last carries usage and no text.
  rpc Generate(GenerateRequest) returns (stream GenerateChunk);
}

message GenerateRequest {
  string prompt = 1;
  // 0 means the default (128).
  uint32 max_tokens = 2;
  // Omitted fields take TinyServe's defaults: temperature 0.8, top_k 50, a random seed.
  optional float temperature = 3;
  optional uint32 top_k = 4;
  optional uint32 seed = 5;
  // Used for per-tenant limits and metrics; may be empty.
  string tenant_id = 6;
}

message GenerateChunk {
  string text = 1;
  // Set on the final chunk only.
  Usage usage = 2;
}

message Usage {
  uint32 prompt_tokens = 1;
  uint32 tokens_generated = 2;
  uint32 seed = 3;
  // The replica that served the request, and how many replicas were tried.
  string backend = 4;
  uint32 attempts = 5;
  // Measured by the backend.
  double backend_latency_ms = 6;
  double backend_queue_ms = 7;
  double backend_ttft_ms = 8;
  // Measured by the gateway: request received -> first chunk sent.
  double gateway_ttft_ms = 9;
}
